[project]
name = "device-systems"
version = "2.0.0"
description = "API REST para la gestión de usuarios con FastAPI y SQLAlchemy"
readme = "README.md"
authors = [
    { name = "kellylop613", email = "johalopera15@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "pydantic[email]>=2.13.5",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.52.4",
]

[project.scripts]
device-systems = "device_systems:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
